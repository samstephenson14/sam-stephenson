<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <title>Sam Stephenson</title>
    <link rel="stylesheet" href="styles.css">
</head>
<header>
</header>
<body>
<style>
    /* Navigation Styles */
    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(17, 24, 39, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(157, 123, 216, 0.3);
        padding: 15px 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .nav-logo {
        font-size: 1.5em;
        font-weight: 700;
        color: #9d7bd8;
        text-decoration: none;
        transition: transform 0.3s ease;
        display: flex;
        align-items: center;
    }

    .nav-logo:hover {
        transform: scale(1.1);
    }

    .nav-links {
        display: flex;
        gap: 30px;
        list-style: none;
        align-items: center;
    }

    .nav-links a {
        color: #d1d5db;
        text-decoration: none;
        font-weight: 500;
        font-size: 1em;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
    }

    .nav-links a:hover {
        color: #9d7bd8;
        background: rgba(157, 123, 216, 0.1);
    }

    .nav-links a.active {
        color: #20b2aa;
        background: rgba(32, 178, 170, 0.15);
    }

    .nav-links a.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 16px;
        right: 16px;
        height: 2px;
        background: linear-gradient(90deg, #9d7bd8, #20b2aa);
        border-radius: 2px;
    }

    /* Mobile Menu Toggle */
    .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        color: #d1d5db;
        font-size: 1.5em;
        cursor: pointer;
        padding: 5px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .mobile-menu-toggle {
            display: block;
        }

        .nav-links {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(10px);
            flex-direction: column;
            gap: 0;
            padding: 20px 0;
            border-bottom: 1px solid rgba(157, 123, 216, 0.3);
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .nav-links.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        .nav-links a {
            width: 100%;
            padding: 15px 30px;
            border-radius: 0;
        }
    }

    /* Add padding to body to account for fixed nav */
    body {
        padding-top: 70px;
    }
</style>

<nav>
    <div class="nav-container">
        <a href="index.html" class="nav-logo">🏠</a>
        
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
        
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="nav-home">Home</a></li>
            <li><a href="cv.html" class="nav-cv">Resume</a></li>
            <li><a href="projects.html" class="nav-projects">Projects</a></li>
            <li><a href="blog.html" class="nav-blog">Blog</a></li>
            <li><a href="resources.html" class="nav-resources">Resources</a></li>
        </ul>
    </div>
</nav>

<script>
    // Mobile menu toggle
    function toggleMobileMenu() {
        const navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('active');
    }

    // Close mobile menu when clicking a link
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.getElementById('navLinks').classList.remove('active');
        });
    });

    // Highlight current page in navigation
    // This script automatically detects which page you're on and highlights it
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    
    // Remove active class from all links
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.remove('active');
    });
    
    // Add active class to current page
    if (currentPage === 'index.html' || currentPage === '') {
        document.querySelector('.nav-home')?.classList.add('active');
    } else if (currentPage === 'cv.html') {
        document.querySelector('.nav-cv')?.classList.add('active');
    } else if (currentPage === 'projects.html') {
        document.querySelector('.nav-projects')?.classList.add('active');
    } else if (currentPage === 'blog.html') {
        document.querySelector('.nav-blog')?.classList.add('active');
    } else if (currentPage === 'resources.html') {
        document.querySelector('.nav-resources')?.classList.add('active');
    }
</script>
    <nav class="container">
        <div class="left"><a href="./index.html">Sam Stephenson</a></div>
        <div class="right"> 
          <ul class="socials">
            <li><a href="./about.html">About</a></li>
            <li class="sm"><a href="./cv.html">Sam's Resume</a></li>
          </ul>
        </div>
    </nav>
    <div> 
    </div>
</body>
</html>
