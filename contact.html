<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Sam Stephenson</title>
  <meta name="description" content="Get in touch with Sam Stephenson about consulting, collaboration, or project management opportunities in AI implementation, chargeback operations, and fraud prevention.">
  <link rel="canonical" href="https://www.samstephenson.me/contact.html">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="shared.css">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.samstephenson.me/contact.html">
  <meta property="og:title" content="Contact Sam Stephenson">
  <meta property="og:description" content="Have a project in mind? Want to discuss chargeback optimisation or AI implementation? Let's talk.">
  <meta property="og:image" content="https://www.samstephenson.me/images/sam.jpg">
  <style>
    .container { max-width: 800px; margin: 0 auto; padding: 60px 20px 80px; }
    .page-header { text-align: center; margin-bottom: 48px; animation: fadeInUp 0.6s ease-out; }
    .page-header h1 {
      font-size: 3em; margin-bottom: 14px; font-weight: 700;
    }
    .page-header p { font-size: 1.15em; color: #9ca3af; max-width: 560px; margin: 0 auto; }
    .contact-wrapper { display: flex; flex-direction: column; gap: 36px; }
    .contact-info {
      background: rgba(17,24,39,0.7); backdrop-filter: blur(10px);
      border-radius: 16px; padding: 34px;
      border: 1px solid rgba(157,123,216,0.3);
    }
    .contact-info h2 { color: #9d7bd8; font-size: 1.4em; margin-bottom: 20px; }
    .contact-methods { display: flex; flex-direction: column; gap: 18px; }
    .contact-method { display: flex; align-items: center; gap: 14px; }
    .contact-method-icon {
      font-size: 1.4em; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(157,123,216,0.2), rgba(32,178,170,0.2));
      border-radius: 10px; border: 1px solid rgba(157,123,216,0.3); flex-shrink: 0;
    }
    .contact-method-info h3 { color: #fff; font-size: 1em; margin-bottom: 3px; }
    .contact-method-info a { color: #20b2aa; text-decoration: none; transition: color 0.3s; }
    .contact-method-info a:hover { color: #9d7bd8; }
    .contact-form-container {
      background: rgba(17,24,39,0.7); backdrop-filter: blur(10px);
      border-radius: 16px; padding: 38px;
      border: 1px solid rgba(157,123,216,0.3);
      animation: fadeInUp 0.6s ease-out;
    }
    .contact-form-container h2 { color: #9d7bd8; font-size: 1.7em; margin-bottom: 24px; font-weight: 700; }
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; color: #d1d5db; font-weight: 500; margin-bottom: 7px; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 13px 16px;
      background: rgba(17,24,39,0.6); border: 1px solid rgba(157,123,216,0.3);
      border-radius: 8px; color: #e0e0e0; font-size: 1em; font-family: inherit;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { outline: none; border-color: #9d7bd8; box-shadow: 0 0 0 3px rgba(157,123,216,0.2); }
    .form-group textarea { resize: vertical; min-height: 140px; }
    .form-group select option { background: #1f2937; }
    .form-submit {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      color: white; background: linear-gradient(135deg, #9d7bd8, #20b2aa);
      border: none; padding: 15px 38px; border-radius: 8px;
      font-size: 1.05em; font-weight: 600; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 4px 15px rgba(157,123,216,0.4); width: 100%;
    }
    .form-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(157,123,216,0.6); }
    .form-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .form-message { margin-top: 18px; padding: 14px 18px; border-radius: 8px; font-weight: 500; display: none; }
    .form-message.success { background: rgba(32,178,170,0.2); border: 1px solid rgba(32,178,170,0.4); color: #20b2aa; display: block; }
    .form-message.error   { background: rgba(239,68,68,0.2);   border: 1px solid rgba(239,68,68,0.4);   color: #ef4444;  display: block; }
    @media(max-width:768px) {
      .page-header h1 { font-size: 2.2em; }
      .contact-form-container { padding: 28px 18px; }
    }
    .contact-method-icon svg { width: 1em; height: 1em; stroke: #9d7bd8; }
    #submitIcon svg { width: 1em; height: 1em; vertical-align: -0.12em; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <script src="nav.js"></script>

  <div class="container">
    <div class="page-header">
      <h1 class="gradient-text">Get In Touch</h1>
      <p>Have a project in mind? Want to discuss chargeback optimisation or AI implementation? Let's talk.</p>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info">
        <h2>Connect With Me</h2>
        <div class="contact-methods">
          <div class="contact-method">
            <div class="contact-method-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#mail"></use></svg></div>
            <div class="contact-method-info">
              <h3>Email</h3>
              <a href="mailto:samstephenson14@gmail.com">samstephenson14@gmail.com</a>
            </div>
          </div>
          <div class="contact-method">
            <div class="contact-method-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#linkedin"></use></svg></div>
            <div class="contact-method-info">
              <h3>LinkedIn</h3>
              <a href="https://www.linkedin.com/in/sam-stephenson-67ab7b9" target="_blank" rel="noopener">Connect on LinkedIn</a>
            </div>
          </div>
          <div class="contact-method">
            <div class="contact-method-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#github"></use></svg></div>
            <div class="contact-method-info">
              <h3>GitHub</h3>
              <a href="https://github.com/samstephenson14" target="_blank" rel="noopener">View My Code</a>
            </div>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <h2>Send Me a Message</h2>
        <form id="contactForm" action="https://formspree.io/f/xnjlqdlb" method="POST">
          <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
          </div>
          <div class="form-group">
            <label for="subject">Subject *</label>
            <select id="subject" name="subject" required>
              <option value="">Select a topic...</option>
              <option value="consulting">Consulting Inquiry</option>
              <option value="collaboration">Collaboration Opportunity</option>
              <option value="job">Job Opportunity</option>
              <option value="speaking">Speaking Engagement</option>
              <option value="question">General Question</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required placeholder="Tell me about your project or question..."></textarea>
          </div>
          <button type="submit" class="form-submit" id="submitBtn">
            <span id="submitText">Send Message</span>
            <span id="submitIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#send"></use></svg></span>
          </button>
          <div class="form-message" id="formMessage"></div>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <p>© <span class="footer-year"></span> Sam Stephenson · Built with integrity and purpose</p>
  </footer>

  <script>
    var form = document.getElementById('contactForm');
    var btn  = document.getElementById('submitBtn');
    var txt  = document.getElementById('submitText');
    var ico  = document.getElementById('submitIcon');
    var msg  = document.getElementById('formMessage');

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      btn.disabled = true; txt.textContent = 'Sending…'; ico.textContent = '⏳';
      msg.style.display = 'none';
      try {
        var res = await fetch(form.action, { method:'POST', body:new FormData(form), headers:{'Accept':'application/json'} });
        if(res.ok){
          msg.className='form-message success'; msg.textContent='✓ Message sent! I\'ll get back to you soon.';
          form.reset(); ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><use href=\"icons.svg#check\"></use></svg>';
        } else {
          msg.className='form-message error'; msg.textContent='✗ Something went wrong. Please try again or email me directly.'; ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><use href=\"icons.svg#x-close\"></use></svg>';
        }
      } catch(err){
        msg.className='form-message error'; msg.textContent='✗ Network error. Please check your connection.'; ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><use href=\"icons.svg#x-close\"></use></svg>';
      } finally {
        btn.disabled=false; txt.textContent='Send Message';
        setTimeout(function(){ ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><use href=\"icons.svg#send\"></use></svg>'; },2000);
      }
    });
  </script>
</body>
</html>
