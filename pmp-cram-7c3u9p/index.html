<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PMP Study Console</title>
<style>
  :root {
    --bg: #0a0f1e;
    --panel: rgba(17, 24, 39, 0.7);
    --panel-solid: #111827;
    --purple: #9d7bd8;
    --teal: #20b2aa;
    --ink: #ffffff;
    --text: #e0e0e0;
    --muted: #9ca3af;
    --muted-soft: #6b7280;
    --border: rgba(157, 123, 216, 0.3);
    --border-strong: rgba(157, 123, 216, 0.5);
    --correct: #20b2aa;
    --correct-soft: rgba(32, 178, 170, 0.15);
    --wrong: #ef4444;
    --wrong-soft: rgba(239, 68, 68, 0.15);
    --update: #60a5fa;
    --update-soft: rgba(96, 165, 250, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(at 20% 30%, rgba(157, 123, 216, 0.15) 0px, transparent 50%),
      radial-gradient(at 80% 70%, rgba(32, 178, 170, 0.15) 0px, transparent 50%);
    background-attachment: fixed;
    padding-top: 70px;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(17, 24, 39, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 15px 0; z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .nav-container {
    max-width: 1200px; margin: 0 auto; padding: 0 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-logo { font-size: 1.5em; color: var(--purple); text-decoration: none; transition: transform 0.3s ease; }
  .nav-logo:hover { transform: scale(1.1); }
  .nav-label { font-size: 0.85em; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 18px 60px; }

  .masthead {
    border-bottom: 2px solid var(--border);
    padding-bottom: 18px; margin-bottom: 16px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .masthead h1 {
    font-weight: 700; font-size: 32px; letter-spacing: -0.025em; line-height: 1;
    background: linear-gradient(135deg, var(--purple) 0%, var(--teal) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .masthead .issue { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted); }

  .tabnav {
    display: flex; gap: 0; margin-bottom: 26px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabnav::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent; border: none; padding: 12px 16px 10px;
    font-family: inherit; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    cursor: pointer; position: relative; white-space: nowrap;
    transition: color 0.15s ease; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--ink); border-bottom-color: var(--purple); }
  .tab .tab-num { color: var(--teal); font-size: 11px; margin-right: 4px; }

  .section { display: none; animation: fadeUp 0.35s cubic-bezier(0.22,1,0.36,1); }
  .section.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .section-head { margin-bottom: 26px; }
  .section-head .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--teal); margin-bottom: 6px; }
  .section-head h2 { font-weight: 700; font-size: 32px; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 8px; color: var(--ink); }
  .section-head h2 em { font-style: normal; color: var(--purple); }
  .section-head .sub { font-size: 16px; color: var(--muted); line-height: 1.5; }

  .card {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; margin-bottom: 18px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card h3 { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin-bottom: 12px; color: var(--ink); }

  .btn {
    background: linear-gradient(135deg, var(--purple), var(--teal));
    color: #fff; border: none; padding: 12px 24px; border-radius: 50px;
    font-family: inherit; font-weight: 600; font-size: 13px; letter-spacing: 0.03em;
    cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 4px 15px rgba(157,123,216,0.4);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(157,123,216,0.6); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost { background: rgba(17,24,39,0.6); color: var(--purple); border: 1.5px solid var(--purple); box-shadow: none; }
  .btn.ghost:hover:not(:disabled) { background: rgba(157,123,216,0.12); transform: translateY(-2px); box-shadow: none; }
  .btn.sm { padding: 9px 16px; font-size: 11px; }

  .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .stat:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: 0 8px 24px rgba(157,123,216,0.2); }
  .stat .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 8px; }
  .stat .num {
    font-weight: 700; font-size: 40px; letter-spacing: -0.03em; line-height: 1; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--purple), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .stat .num em { font-style: normal; color: var(--muted); font-size: 16px; margin-left: 2px; -webkit-text-fill-color: var(--muted); }
  .stat .detail { font-size: 12px; color: var(--muted); }

  .next-up {
    background: linear-gradient(135deg, rgba(157,123,216,0.18), rgba(32,178,170,0.18));
    border: 1px solid var(--border-strong); border-radius: 16px; padding: 28px; margin-bottom: 18px;
  }
  .next-up .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--teal); margin-bottom: 10px; }
  .next-up h3 { font-weight: 600; font-size: 22px; line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 18px; color: var(--ink); }

  .domains-table {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
  }
  .domains-table h3 { font-weight: 700; font-size: 18px; margin-bottom: 14px; letter-spacing: -0.01em; color: var(--ink); }
  .domains-table .drow {
    display: grid; grid-template-columns: 1fr 50px 80px; gap: 10px; padding: 10px 0;
    border-bottom: 1px dashed rgba(157,123,216,0.2); align-items: center; font-size: 13px;
  }
  .domains-table .drow:last-child { border-bottom: none; }
  .domains-table .drow .name { font-weight: 600; color: var(--text); }
  .domains-table .drow .pct { color: var(--muted); font-size: 11px; text-align: right; }
  .domains-table .drow .score { font-size: 12px; text-align: right; font-weight: 700; color: var(--teal); }

  .week {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px;
    overflow: hidden; transition: border-color 0.3s ease;
  }
  .week.expanded { border-color: var(--border-strong); }
  .week-head { padding: 18px; cursor: pointer; display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center; transition: background 0.15s ease; }
  .week-head:hover { background: rgba(157,123,216,0.06); }
  .week-num { font-weight: 700; font-size: 30px; letter-spacing: -0.04em; line-height: 1; color: var(--purple); }
  .week-num em { font-style: normal; font-size: 13px; color: var(--muted); margin-right: 2px; display:block; }
  .week-title { font-weight: 600; font-size: 17px; line-height: 1.25; letter-spacing: -0.01em; color: var(--ink); }
  .week-prog { font-size: 12px; color: var(--muted); text-align: right; font-weight: 500; }
  .week-prog .bar { width: 70px; height: 5px; background: rgba(17,24,39,0.8); border: 1px solid var(--border); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .week-prog .fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--teal)); width: 0%; transition: width 0.4s ease; }
  .week-body { display: none; padding: 4px 18px 22px; }
  .week.expanded .week-body { display: block; }
  .week-body .goal { font-size: 15px; color: var(--text); margin-bottom: 16px; padding-left: 14px; border-left: 3px solid var(--teal); font-style: italic; }
  .week-body .focus-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted); margin: 16px 0 8px; }

  .task { display: flex; gap: 12px; padding: 9px 0; align-items: flex-start; border-bottom: 1px dashed rgba(157,123,216,0.15); }
  .task:last-child { border-bottom: none; }
  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 20px; height: 20px;
    border: 1.5px solid var(--border-strong); border-radius: 6px; background: rgba(17,24,39,0.6);
    cursor: pointer; flex-shrink: 0; margin-top: 2px; position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .task input[type="checkbox"]:checked { background: linear-gradient(135deg, var(--purple), var(--teal)); border-color: transparent; }
  .task input[type="checkbox"]:checked::after { content: "✓"; position: absolute; color: #fff; font-size: 13px; font-weight: 700; top: 0px; left: 4px; }
  .task label { cursor: pointer; font-size: 14px; line-height: 1.5; color: var(--text); transition: color 0.15s ease; }
  .task input:checked + label { color: var(--muted-soft); text-decoration: line-through; }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px;
    background: rgba(17,24,39,0.6); font-family: inherit; font-size: 14px; color: var(--ink); transition: all 0.3s ease;
  }
  .search::placeholder { color: var(--muted-soft); }
  .search:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(157,123,216,0.2); }
  .chip {
    padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 50px; background: rgba(17,24,39,0.6);
    font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease; color: var(--text);
  }
  .chip:hover { background: rgba(157,123,216,0.12); border-color: var(--border-strong); }
  .chip.active { background: linear-gradient(135deg, var(--purple), var(--teal)); color: #fff; border-color: transparent; }

  .sheet-section {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 14px; padding: 24px;
  }
  .sheet-section.hidden-by-filter { display: none; }
  .sheet-section h3 { font-weight: 700; font-size: 22px; letter-spacing: -0.015em; margin-bottom: 4px; color: var(--ink); }
  .sheet-section .domain-meta { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--teal); margin-bottom: 16px; }
  .sheet-item { padding: 12px 0; border-bottom: 1px dashed rgba(157,123,216,0.15); font-size: 14px; line-height: 1.6; }
  .sheet-item:last-child { border-bottom: none; }
  .sheet-item .term { font-weight: 700; color: var(--purple); margin-right: 4px; }
  .sheet-item .body { color: var(--text); }
  .sheet-item.hidden { display: none; }

  .update-flag {
    background: var(--update-soft); border-left: 3px solid var(--update); border-radius: 6px;
    padding: 10px 14px; margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--text);
  }
  .update-flag .tag {
    display: inline-block; background: var(--update); color: #0a0f1e; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.15em; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight: 700;
  }
  mark { background: rgba(157,123,216,0.4); color: #fff; padding: 0 2px; border-radius: 2px; }

  .fc-controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
  .fc-counter { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
  .fc-counter .cur { color: var(--purple); font-weight: 700; }
  .flashcard { perspective: 1200px; margin-bottom: 16px; height: 280px; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); transform-style: preserve-3d; cursor: pointer; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; overflow: hidden;
  }
  .fc-front { background: var(--panel); backdrop-filter: blur(10px); }
  .fc-back { background: linear-gradient(135deg, rgba(157,123,216,0.2), rgba(32,178,170,0.2)); border-color: var(--border-strong); transform: rotateY(180deg); }
  .fc-domain { font-size: 9px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--teal); margin-bottom: 12px; }
  .fc-term { font-weight: 700; font-size: 32px; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px; color: var(--ink); }
  .fc-hint { font-size: 13px; color: var(--muted-soft); margin-top: auto; font-style: italic; }
  .fc-def { font-size: 16px; line-height: 1.55; font-weight: 400; color: var(--text); }
  .fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .fc-mark {
    padding: 13px; border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s ease; background: rgba(17,24,39,0.6);
  }
  .fc-mark.review { color: var(--purple); border: 1.5px solid var(--purple); }
  .fc-mark.review:hover { background: rgba(157,123,216,0.15); }
  .fc-mark.master { color: var(--teal); border: 1.5px solid var(--teal); }
  .fc-mark.master:hover { background: rgba(32,178,170,0.15); }
  .fc-nav { display: flex; justify-content: space-between; gap: 8px; }
  .fc-status { text-align: center; font-size: 11px; color: var(--muted); margin: 10px 0; letter-spacing: 0.08em; }
  .fc-status .mas { color: var(--teal); }
  .fc-status .rev { color: var(--purple); }

  .quiz-modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
  .mode {
    padding: 20px 18px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--panel); backdrop-filter: blur(10px); cursor: pointer; text-align: left;
    transition: all 0.2s ease; font-family: inherit;
  }
  .mode:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(157,123,216,0.25); }
  .mode .mode-name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 5px; color: var(--ink); }
  .mode .mode-meta { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .progress-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .progress-bar { flex: 1; height: 6px; background: rgba(17,24,39,0.8); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--teal)); width: 0%; transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  .progress-counter { font-size: 11px; color: var(--muted); }

  .domain-tag {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em;
    background: linear-gradient(135deg, var(--purple), var(--teal)); color: #fff; padding: 6px 12px;
    border-radius: 50px; margin-bottom: 14px; font-weight: 600;
  }
  .q-num { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .q-text { font-weight: 700; font-size: 22px; line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 20px; color: var(--ink); }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--panel); backdrop-filter: blur(10px); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 15px 18px; cursor: pointer; text-align: left; font-family: inherit; font-size: 14.5px; line-height: 1.4;
    color: var(--text); transition: all 0.15s ease; display: flex; gap: 12px; align-items: flex-start; width: 100%;
  }
  .option:hover:not(:disabled) { border-color: var(--border-strong); background: rgba(157,123,216,0.08); transform: translateY(-2px); }
  .option:disabled { cursor: default; }
  .option .letter { font-weight: 700; color: var(--teal); flex-shrink: 0; width: 16px; }
  .option.correct { background: var(--correct-soft); border-color: var(--correct); color: var(--correct); }
  .option.correct .letter { color: var(--correct); }
  .option.wrong { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); }
  .option.wrong .letter { color: var(--wrong); }
  .option.faded { opacity: 0.45; }

  .feedback {
    margin-top: 16px; padding: 16px 18px; border-left: 4px solid var(--purple);
    background: var(--panel); border-radius: 8px; font-size: 13.5px; line-height: 1.55; color: var(--text);
  }
  .feedback.correct { border-left-color: var(--correct); }
  .feedback.wrong { border-left-color: var(--wrong); }
  .feedback strong { display: block; text-transform: uppercase; letter-spacing: 0.13em; font-size: 10px; margin-bottom: 6px; }
  .feedback.correct strong { color: var(--correct); }
  .feedback.wrong strong { color: var(--wrong); }

  .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  .result-card { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--border-strong); border-radius: 16px; padding: 30px; }
  .score-headline {
    font-weight: 700; font-size: 56px; letter-spacing: -0.035em; line-height: 1; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--purple), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .score-headline em { font-style: normal; color: var(--muted); font-size: 26px; -webkit-text-fill-color: var(--muted); }
  .score-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 18px; }
  .verdict { font-size: 18px; line-height: 1.4; color: var(--text); border-top: 1px solid var(--border); padding-top: 18px; margin-bottom: 22px; }
  .breakdown { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .breakdown-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 12px; }
  .breakdown-row .name { font-weight: 600; flex: 0 0 auto; color: var(--text); }
  .breakdown-row .track { flex: 1; height: 8px; background: rgba(17,24,39,0.8); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .breakdown-row .fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--teal)); }
  .b
